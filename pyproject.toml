[project]
name = "smart-heating-scheduler"
version = "0.6.0.dev4"
description = "Home Assistant heating scheduler; observe-only by default"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
